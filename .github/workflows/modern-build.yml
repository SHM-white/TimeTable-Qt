name: TimeTable Next - Build and Package
on:
  push:
    branches: ['codex/desktop-migration-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-tests:
    name: Linux / model tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Offscreen UI smoke - light and dark
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./build/bin/TimeTableNext --smoke-test-light
          ./build/bin/TimeTableNext --smoke-test-dark
          ./build/bin/TimeTableNext --smoke-navigation
          ./build/bin/TimeTableNext --smoke-test-english
  qt5-compatibility:
    name: Qt 5.15 legacy compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install legacy Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qtbase5-dev-tools ninja-build
      - name: Configure Qt 5
        run: cmake -S . -B build-qt5 -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DTIMETABLE_FORCE_QT5=ON
      - name: Compile with Qt 5
        run: cmake --build build-qt5 --parallel 2
      - name: Test Qt 5 model
        run: ctest --test-dir build-qt5 --output-on-failure
      - name: Qt 5 UI smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./build-qt5/bin/TimeTableNext --smoke-test-light
          ./build-qt5/bin/TimeTableNext --smoke-test-dark
          ./build-qt5/bin/TimeTableNext --smoke-navigation
          ./build-qt5/bin/TimeTableNext --smoke-test-english

  windows-qt5-legacy:
    name: Windows Qt 5.15 ZIP + installer / Win7 candidate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: MSVC compiler environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Qt 5.15.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true
      - name: Add Qt5 runtime to PATH
        shell: pwsh
        run: |
          "$env:QT_ROOT_DIR/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Configure Qt5
        run: cmake -S . -B build-win7 -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DTIMETABLE_FORCE_QT5=ON
      - name: Build
        run: cmake --build build-win7 --parallel 2
      - name: Deploy full Qt5 GUI test runtime
        shell: pwsh
        run: |
          # schedule_tests links only QtCore. Deploy using the actual GUI
          # executable so the test directory also gets QtGui, Widgets,
          # Network, and the required platform plugins.
          windeployqt --release --no-translations --dir build-win7 build-win7/bin/TimeTableNext.exe
          if ($LASTEXITCODE -ne 0) { throw 'Qt 5 test runtime deployment failed' }
          foreach ($name in @('Qt5Core.dll', 'Qt5Gui.dll', 'Qt5Widgets.dll', 'Qt5Network.dll')) {
            if (-not (Test-Path "build-win7/$name")) { throw "Missing test dependency: $name" }
          }
      - name: Provide Windows system fonts to Qt5 offscreen tests
        shell: pwsh
        run: |
          # Qt 5's Windows offscreen QPA plugin uses QBasicFontDatabase.
          # It looks in <Qt application directory>/lib/fonts rather than
          # resolving installed Windows fonts automatically. Without a font,
          # QPainter renders empty text and geometry assertions fail.
          $fontDir = 'build-win7/lib/fonts'
          New-Item -ItemType Directory -Force -Path $fontDir | Out-Null
          foreach ($font in @('arial.ttf', 'segoeui.ttf', 'msyh.ttc')) {
            $source = Join-Path (Join-Path $env:WINDIR 'Fonts') $font
            if (Test-Path $source) { Copy-Item -Path $source -Destination $fontDir }
          }
          if (-not (Get-ChildItem -Path $fontDir -File -Filter '*.ttf' | Select-Object -First 1)) {
            throw 'Qt5 offscreen tests require at least one installed TrueType font'
          }
          # Fonts are used only by the CI tests; they are not packaged.
      - name: Test
        env:
          # Qt5 on Windows otherwise may send qCritical diagnostics to
          # OutputDebugString rather than the captured CTest stderr stream.
          QT_ASSUME_STDERR_HAS_CONSOLE: '1'
        run: ctest --test-dir build-win7 --output-on-failure -V
      - name: Print failing Qt5 test output
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build-win7/Testing/Temporary/LastTest.log) {
            Get-Content build-win7/Testing/Temporary/LastTest.log
          }
      - name: Package Qt 5 runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/TimeTableNext-Qt5 | Out-Null
          Copy-Item build-win7/bin/TimeTableNext.exe dist/TimeTableNext-Qt5/
          windeployqt --release --no-translations --dir dist/TimeTableNext-Qt5 dist/TimeTableNext-Qt5/TimeTableNext.exe
          Copy-Item README-NEXT.md dist/TimeTableNext-Qt5/README.txt
          Compress-Archive -Path dist/TimeTableNext-Qt5 -DestinationPath TimeTableNext-Qt5-Win7-Candidate.zip -Force
      - name: Prepare Inno Setup 6.2.2
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          $isccCommand = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($isccCommand) { $iscc = $isccCommand.Source }
          $version = if (Test-Path $iscc) { (Get-Item $iscc).VersionInfo.ProductVersion } else { '' }
          if ($version -notmatch '^6\.2\.2(?:\D|$)') {
            if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
              throw 'Inno Setup 6.2.2 is required for the legacy installer, and Chocolatey is unavailable'
            }
            choco upgrade innosetup --version=6.2.2 --allow-downgrade --force --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe was not found' }
          "TIMETABLE_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build Qt 5 per-user installer
        shell: pwsh
        run: |
          $versionMatch = [regex]::Match((Get-Content CMakeLists.txt -Raw), '(?m)^\s*project\(TimeTableNext\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)')
          if (-not $versionMatch.Success) { throw 'Cannot read the CMake project version' }
          & $env:TIMETABLE_ISCC "/DAppVersion=$($versionMatch.Groups[1].Value)" `
            "/DSourceDir=$((Resolve-Path dist/TimeTableNext-Qt5).Path)" `
            "/DOutputDir=$PWD/dist/installers" /DQt5Legacy `
            packaging/windows/TimeTableNext.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: TimeTableNext-Qt5-Win7-Candidate
          path: TimeTableNext-Qt5-Win7-Candidate.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload Qt 5 installer
        uses: actions/upload-artifact@v4
        with:
          name: TimeTableNext-Qt5-Windows-x64-Installer
          path: dist/installers/TimeTableNext-*-Qt5-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 30

  windows-portable:
    name: Windows x64 / ZIP + installer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/TimeTableNext | Out-Null
          Copy-Item build/bin/TimeTableNext.exe dist/TimeTableNext/
          windeployqt --release --no-translations --dir dist/TimeTableNext dist/TimeTableNext/TimeTableNext.exe
          Copy-Item README-NEXT.md dist/TimeTableNext/README.txt
          Compress-Archive -Path dist/TimeTableNext -DestinationPath TimeTableNext-Windows-x64.zip -Force
      - name: Prepare Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          $isccCommand = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($isccCommand) { $iscc = $isccCommand.Source }
          if (-not (Test-Path $iscc)) {
            if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
              throw 'Inno Setup is required, and Chocolatey is unavailable'
            }
            choco install innosetup --version=6.2.2 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe was not found' }
          "TIMETABLE_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build Qt 6 per-user installer
        shell: pwsh
        run: |
          $versionMatch = [regex]::Match((Get-Content CMakeLists.txt -Raw), '(?m)^\s*project\(TimeTableNext\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)')
          if (-not $versionMatch.Success) { throw 'Cannot read the CMake project version' }
          & $env:TIMETABLE_ISCC "/DAppVersion=$($versionMatch.Groups[1].Value)" `
            "/DSourceDir=$((Resolve-Path dist/TimeTableNext).Path)" `
            "/DOutputDir=$PWD/dist/installers" `
            packaging/windows/TimeTableNext.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TimeTableNext-Windows-x64
          path: TimeTableNext-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: TimeTableNext-Windows-x64-Installer
          path: dist/installers/TimeTableNext-*-Qt6-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 30
