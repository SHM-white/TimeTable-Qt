name: Publish TimeTable Next

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing Git tag to package, for example v4.2.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: timetable-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Check release tag and project version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate tag and version
        id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Only stable release tags such as v4.2.0 are supported.' >&2
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${tag}^{commit}" >/dev/null; then
            echo "Tag $tag does not exist in the repository." >&2
            exit 1
          fi
          commit=$(git rev-parse "refs/tags/${tag}^{commit}")
          version=$(git show "${commit}:CMakeLists.txt" | sed -nE 's/^[[:space:]]*project\(TimeTableNext[[:space:]]+VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -n 1)
          if [[ -z "$version" || "$tag" != "v$version" ]]; then
            echo "Tag $tag does not match CMake project version ${version:-unknown}." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check for an already populated Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            count=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')
            if (( count > 0 )); then
              echo "Release $RELEASE_TAG already has $count assets; refusing to overwrite it." >&2
              exit 1
            fi
            echo "Release $RELEASE_TAG exists without assets; it can be repaired."
          fi

  build:
    name: Build and package all platforms
    needs: validate
    uses: ./.github/workflows/modern-build.yml
    with:
      source_ref: ${{ needs.validate.outputs.tag }}

  publish:
    name: Verify assets and publish Release
    runs-on: ubuntu-24.04
    needs: [validate, build]
    permissions:
      contents: write
    steps:
      - name: Download artifacts from successful builds
        uses: actions/download-artifact@v4
        with:
          pattern: TimeTableNext-*
          path: assets
          merge-multiple: true
      - name: Check every package and create SHA256SUMS.txt
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          cd assets
          test -s TimeTableNext-Windows-x64.zip
          test -s TimeTableNext-Qt5-Win7-Candidate.zip
          mv TimeTableNext-Windows-x64.zip "TimeTableNext-v${VERSION}-Windows-Qt6-x64.zip"
          mv TimeTableNext-Qt5-Win7-Candidate.zip "TimeTableNext-v${VERSION}-Windows-Qt5-x64-Win7-Candidate.zip"
          for qt in Qt5 Qt6; do
            test -s "TimeTableNext-${VERSION}-${qt}-Windows-x64-Setup.exe"
            for distro in Ubuntu24.04 Debian13; do
              test -s "TimeTableNext-v${VERSION}-Linux-${distro}-${qt}-amd64.deb"
              test -s "TimeTableNext-v${VERSION}-Linux-${distro}-${qt}-x86_64.tar.gz"
            done
          done
          shopt -s nullglob
          files=(TimeTableNext-*)
          if (( ${#files[@]} != 12 )); then
            echo "Expected 12 packages, found ${#files[@]}." >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Create or complete GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            count=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')
            if (( count != 0 )); then
              echo "Release $RELEASE_TAG acquired assets while builds were running; refusing to overwrite." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" assets/*
            gh release edit "$RELEASE_TAG" --draft=false
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "TimeTable Next $RELEASE_TAG" --generate-notes
            gh release upload "$RELEASE_TAG" assets/*
            gh release edit "$RELEASE_TAG" --draft=false
          fi
